<!DOCTYPE html>
<html>

    <head>
        <title>Students</title>
    </head>

    <body>
        <h1>Student List</h1>
        <a href="{% url 'student_add' %}">+ Add Student</a>
        <hr>


        {% if students %}
        <ul>
            {% for s in students %}
            <li>
                {{ s.name }} - {{ s.age }} - {{ s.email }}
                | <a href="{% url 'student_edit' s.id %}">Edit</a>
                | <a href="{% url 'student_delete' s.id %}">Delete</a>
            </li>

            {% endfor %}
        </ul>
        {% else %}
        <p>No students found.</p>
        {% endif %}
    </body>

</html>
