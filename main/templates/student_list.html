{% extends "base.html" %}

{% block title %}Student List{% endblock %}

{% block content %}
<h1>Student List</h1>

<ul>
    {% for s in students %}
        <li>
            {{ s.name }} - {{ s.age }} - {{ s.email }}
            | <a href="{% url 'student_edit' s.id %}">Edit</a>
            | <a href="{% url 'student_delete' s.id %}">Delete</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
